mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  # 本地密码通过 RELAYIM_MYSQL_PASSWORD 注入。
  password: ""
  dbname: relayim
  config:
    charset: utf8mb4
    parseTime: true
    loc: UTC

jwt:
  # 本地密钥通过 RELAYIM_JWT_SECRET 注入。
  secret: ""
  expire_hours: 24
  refresh_expire_days: 30

redis:
  host: 127.0.0.1
  port: 6379
  # 本地密码通过 RELAYIM_REDIS_PASSWORD 注入。
  password: ""
  db: 0

rabbitmq:
  # 完整 AMQP 地址通过 RELAYIM_RABBITMQ_URL 注入；为空时禁用 RabbitMQ 后台任务。
  url: ""
  publish_timeout_seconds: 5
  poll_interval_ms: 500
  batch_size: 100
  max_publish_attempts: 10
  retry_base_seconds: 2
  claim_lease_seconds: 30
  prefetch: 20

s3:
  endpoint: 127.0.0.1:8333
  # 容器部署可通过 RELAYIM_S3_PUBLIC_ENDPOINT 指定浏览器可访问的预签名地址。
  public_endpoint: ""
  access_key: ""
  secret_key: ""
  bucket: relayim-media
  region: us-east-1
  use_ssl: false

rate_limit:
  ws_ticket_global: 250
  ws_ticket_user: 10
  ws_ticket_window_ms: 1000

snowflake:
  # 多实例部署时，每个实例必须使用不同且唯一的 worker ID。
  workID: 1

tracing:
  # 本地开发默认导出到 deploy/docker-compose.yml 中的 Tempo。
  enabled: true
  service_name: relayim
  otlp_endpoint: http://127.0.0.1:4318
  sample_ratio: 1.0

attachment_cleanup:
  # 清理超过 24 小时仍未绑定消息的待确认附件。
  enabled: true
  interval_seconds: 3600
  pending_ttl_hours: 24
  claim_lease_seconds: 600
  batch_size: 100
