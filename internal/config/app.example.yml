mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  # 本地密码通过 RELAYIM_MYSQL_PASSWORD 注入。
  password: ""
  dbname: relayim
  config:
    charset: utf8mb4
    parseTime: true
    loc: UTC
  pool:
    # 单实例连接上限；多实例部署时需保证总和低于 MySQL max_connections
    max_open: 50
    max_idle: 10
    conn_max_lifetime_minutes: 30

jwt:
  # 本地密钥通过 RELAYIM_JWT_SECRET 注入。
  secret: ""
  expire_hours: 24
  refresh_expire_days: 30

redis:
  host: 127.0.0.1
  port: 6379
  # 本地密码通过 RELAYIM_REDIS_PASSWORD 注入。
  password: ""
  db: 0
  dial_timeout_seconds: 3
  read_timeout_seconds: 2
  write_timeout_seconds: 2
  pool_timeout_seconds: 3
  max_retries: 1

rabbitmq:
  # 完整 AMQP 地址通过 RELAYIM_RABBITMQ_URL 注入；为空时禁用 RabbitMQ 后台任务。
  url: ""
  publish_timeout_seconds: 5
  poll_interval_ms: 500
  batch_size: 100
  max_publish_attempts: 10
  retry_base_seconds: 2
  claim_lease_seconds: 30
  prefetch: 20
  # 本机实测 4 个连接可并行处理领域事件并缩短大群扇出排队
  consumer_workers: 4

s3:
  endpoint: 127.0.0.1:8333
  # 容器部署可通过 RELAYIM_S3_PUBLIC_ENDPOINT 指定浏览器可访问的预签名地址。
  public_endpoint: ""
  access_key: ""
  secret_key: ""
  bucket: relayim-media
  region: us-east-1
  use_ssl: false

rate_limit:
  # 与单群 500 人上限对齐，避免集中重连时产生无意义重试
  ws_ticket_global: 500
  ws_ticket_user: 10
  ws_ticket_window_ms: 1000
  # 500 条消息的安全基线；高配部署可结合压测结果继续调高
  message_send_user: 20
  message_send_global: 1000
  message_send_window_ms: 10000

snowflake:
  # 多实例部署时，每个实例必须使用不同且唯一的 worker ID。
  workID: 1

tracing:
  # 本地开发默认导出到 deploy/docker-compose.yml 中的 Tempo。
  enabled: true
  service_name: relayim
  otlp_endpoint: http://127.0.0.1:4318
  sample_ratio: 1.0

attachment_cleanup:
  # 清理超过 24 小时仍未绑定消息的待确认附件。
  enabled: true
  interval_seconds: 3600
  pending_ttl_hours: 24
  claim_lease_seconds: 600
  batch_size: 100
