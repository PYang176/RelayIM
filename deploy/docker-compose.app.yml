services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migration
    image: relayim-migrate:local
    environment:
      RELAYIM_MYSQL_DSN: "${RELAYIM_MYSQL_USER:-root}:${RELAYIM_MYSQL_PASSWORD:-${RELAYIM_MYSQL_ROOT_PASSWORD:?}}@tcp(${RELAYIM_MYSQL_HOST:-host.docker.internal}:${RELAYIM_MYSQL_PORT:-3306})/${RELAYIM_MYSQL_DBNAME:-relayim}?charset=utf8mb4&parseTime=true&loc=UTC"
    command:
      [
        "sh",
        "-c",
        "attempt=0; until goose -dir /migrations mysql \"$$RELAYIM_MYSQL_DSN\" status >/dev/null 2>&1; do attempt=$$((attempt + 1)); if [ \"$$attempt\" -ge 30 ]; then echo '无法连接本机 MySQL，请检查 host.docker.internal、端口和账号权限' >&2; exit 1; fi; sleep 2; done; exec goose -dir /migrations mysql \"$$RELAYIM_MYSQL_DSN\" up",
      ]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    image: relayim-app:local
    container_name: relayim-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      RELAYIM_CONFIG_FILE: /app/internal/config/app.yml
      RELAYIM_SERVER_ADDR: ":8081"
      RELAYIM_MYSQL_HOST: ${RELAYIM_MYSQL_HOST:-host.docker.internal}
      RELAYIM_MYSQL_PORT: ${RELAYIM_MYSQL_PORT:-3306}
      RELAYIM_MYSQL_USER: ${RELAYIM_MYSQL_USER:-root}
      RELAYIM_MYSQL_PASSWORD: ${RELAYIM_MYSQL_PASSWORD:-${RELAYIM_MYSQL_ROOT_PASSWORD:?}}
      RELAYIM_MYSQL_DBNAME: ${RELAYIM_MYSQL_DBNAME:-relayim}
      RELAYIM_JWT_SECRET: ${RELAYIM_JWT_SECRET:?请设置 RELAYIM_JWT_SECRET}
      RELAYIM_REDIS_HOST: redis
      RELAYIM_REDIS_PORT: 6379
      RELAYIM_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RELAYIM_RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_VHOST}"
      RELAYIM_RABBITMQ_CONSUMER_WORKERS: ${RELAYIM_RABBITMQ_CONSUMER_WORKERS:-4}
      RELAYIM_S3_ENDPOINT: seaweedfs:8333
      RELAYIM_S3_PUBLIC_ENDPOINT: ${RELAYIM_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      RELAYIM_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      RELAYIM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RELAYIM_S3_BUCKET: ${S3_BUCKET:-relayim-media}
      RELAYIM_S3_REGION: us-east-1
      RELAYIM_S3_USE_SSL: "false"
      RELAYIM_TRACING_ENABLED: ${RELAYIM_TRACING_ENABLED:-true}
      RELAYIM_TRACING_OTLP_ENDPOINT: http://tempo:4318
      RELAYIM_ATTACHMENT_CLEANUP_ENABLED: ${RELAYIM_ATTACHMENT_CLEANUP_ENABLED:-true}
      RELAYIM_WS_TICKET_RATE_LIMIT_GLOBAL: ${RELAYIM_WS_TICKET_RATE_LIMIT_GLOBAL:-500}
      RELAYIM_MESSAGE_RATE_LIMIT_USER: ${RELAYIM_MESSAGE_RATE_LIMIT_USER:-20}
      RELAYIM_MESSAGE_RATE_LIMIT_GLOBAL: ${RELAYIM_MESSAGE_RATE_LIMIT_GLOBAL:-1000}
      RELAYIM_MESSAGE_RATE_LIMIT_WINDOW_MS: ${RELAYIM_MESSAGE_RATE_LIMIT_WINDOW_MS:-10000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      tempo:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8081/health/ready >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: relayim-web:local
    container_name: relayim-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/healthz >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
