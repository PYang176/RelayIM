global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692

  # The Go service runs on the Windows host while it is under development.
  # This target becomes healthy after /metrics is implemented.
  - job_name: ginchat-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8081
