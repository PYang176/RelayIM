global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets:
          - rabbitmq:15692

  # 开发阶段 Go 服务运行在 Windows 主机，通过 Docker 网关抓取指标。
  - job_name: relayim-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8081
